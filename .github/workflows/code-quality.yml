name: Code quality

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality (${{ matrix.check }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [lint, tests, build-web, build-dashboard, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.11.1

      # Exact key only: restore-keys made every lockfile change re-save the
      # previous cache plus new packages, so it grew past 1.4 GB.
      - name: Restore Bun package cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-v2-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Check Vercel installs
        if: matrix.check == 'build-web'
        run: |
          for app in dashboard web ui agent onboarding-agent; do
            echo "::group::Check $app Vercel install"
            (
              cd "apps/$app"
              bash -c "$(bun -p 'require("./vercel.json").installCommand')"
            )
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One writer per lockfile; parallel saves of the same key all but one fail.
      - name: Save Bun package cache
        if: matrix.check == 'lint' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Run ultracite check
        if: matrix.check == 'lint'
        run: bun check

      # PRs test only packages their diff affects (plus dependents); main
      # pushes still run everything because they gate production releases.
      - name: Run unit and integration tests
        if: matrix.check == 'tests'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            TURBO_SCM_BASE="$BASE_SHA" bun run test --force --log-order=stream --affected
          else
            bun run test --force --log-order=stream
          fi

      - name: Verify production markdown endpoints
        if: matrix.check == 'build-web'
        run: |
          bun run build --filter=web
          cd apps/web
          bun run test:production

      - name: Verify dashboard Vercel build
        if: matrix.check == 'build-dashboard'
        working-directory: apps/dashboard
        env:
          VERCEL: "1"
        run: bun run build

      - name: Restore incremental TypeScript state
        if: matrix.check == 'typecheck'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            apps/*/.cache/typecheck.tsbuildinfo
            packages/*/.cache/typecheck.tsbuildinfo
          key: typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/typescript-config/*.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/typescript-config/*.json') }}-

      - name: Typecheck tested packages and UI docs
        if: matrix.check == 'typecheck'
        run: bun run check-types --filter=@usenotra/geo --filter=@notra/agent --filter=@notra/ai --filter=@notra/geo-core --filter=dashboard --filter=ui --filter=web

  infrastructure:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notra_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notra_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.11.1

      - name: Restore Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-v2-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration journal
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run db:check --base="$MIGRATION_BASE_REF"

      - name: Replay migrations and verify rerun safety
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Test post history triggers on migrated schema
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: bun test ./tests/post-history.test.ts

      - name: Test observability configuration and dashboard regressions
        run: bun test --isolate infra/observability

      - name: Typecheck Railway infrastructure
        run: bunx --no-install tsc --project .railway/tsconfig.json

      - name: Typecheck Vercel metric exporter
        run: bunx --no-install tsc --project infra/observability/vercel/tsconfig.json

      - name: Validate observability configuration with pinned native binaries
        run: node infra/observability/validate-config.mjs

      - name: Evaluate dashboard queries against disposable pinned Loki fixtures
        run: node infra/observability/check-queries.mjs

  quality:
    if: always()
    needs: [checks, infrastructure]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Require all quality checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$INFRASTRUCTURE_RESULT" = success
